<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同一間教室</title>
<meta name="description" content="2D 校園體驗遊戲：換成班上某位同學的腦袋過一天，再看看環境調整後，同一天會變得怎樣。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f5efe4;--paper:#fffdf8;--ink:#2b2a33;--mute:#6d6a75;--line:rgba(43,42,51,.14);
  --pr:#2f8f9d;--pr-soft:#dff0f1;--kq:#d9694b;--kq-soft:#fbe5dc;
  --accent:var(--pr);--soft:var(--pr-soft);
  --warn:#c8432f;--ok:#2f7d55;--gold:#f2b53a;
  --display:"Iansui","Kaiti TC","DFKai-SB",serif;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:light;
}
body[data-lv="kq"]{--accent:var(--kq);--soft:var(--kq-soft)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.7 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.scr{position:fixed;inset:0;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{min-height:44px;padding:6px 14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* start */
#start .hero{text-align:center;padding:24px 0 8px}
#start .hero h1{font-size:clamp(44px,9vw,76px);letter-spacing:.08em}
#start .hero p{margin:6px 0 0;color:var(--mute);font-size:18px}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:24px 0}
.char{background:var(--paper);border-radius:20px;padding:20px;border:2px solid var(--line);display:grid;gap:10px;text-align:left}
.char .face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;font-family:var(--display)}
.char h2{font-size:28px}
.char .sub{color:var(--mute);margin:0}
.char .lvl{font-weight:700}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:13px;padding:2px 10px;border-radius:999px;background:#ece7dd;color:var(--mute)}
.badge.on{background:var(--ok);color:#fff}
.note{background:var(--paper);border-radius:14px;padding:12px 16px;color:var(--mute);font-size:15px;border:1px dashed var(--line)}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--mute);line-height:1.8}

/* warm-up */
.board{background:#2f4f43;color:#f4f1e6;border-radius:16px;padding:28px 20px;text-align:center;font-family:var(--display);font-size:clamp(26px,5vw,38px);border:10px solid #8a6a48;margin:20px 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cloud{position:relative;margin:22px 0;background:#fff;border:2px dashed var(--c,#8a96a0);border-radius:26px;padding:18px 20px;font-size:18px;min-height:96px}
.cloud::before{content:"💭";position:absolute;top:-18px;left:18px;font-size:26px}
.cloud p{margin:0 0 6px}

/* intro / phase cards */
.card{background:var(--paper);border-radius:20px;padding:24px 20px;border:2px solid var(--line);margin:20px 0}
.card h2{font-size:32px;margin-bottom:8px}
.card ul{margin:8px 0;padding-left:22px}
.key{display:inline-block;min-width:26px;text-align:center;font-size:13px;font-weight:700;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;background:#fff}
.meterDemo{display:flex;align-items:center;gap:10px;margin:8px 0}

/* game */
#game{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:#c9c2b4}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:var(--paper);border-bottom:2px solid var(--line);z-index:3}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.who i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.clock{color:var(--mute);font-size:14px}
.meter{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:200px}
.meter b{font-size:14px;white-space:nowrap}
.bar{flex:1;height:14px;border-radius:999px;background:#ece7dd;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:20%;background:var(--accent);border-radius:999px;transition:width .6s,background .6s}
.meter span{font-size:14px;min-width:5em;color:var(--mute)}
.mode{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--accent)}
.ibtn{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff}
#stage{position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;transition:.4s;background:rgba(43,42,51,.88);color:#fff;border-radius:999px;padding:8px 18px;font-size:15px;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#banner.on{opacity:1;transform:translate(-50%,0)}
.goalbar{display:flex;align-items:center;gap:10px;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--line);z-index:3}
.goalbar .g{flex:1;font-size:15px}
.goalbar .g b{color:var(--accent)}

/* scene sheet */
#shade{position:fixed;inset:0;background:rgba(30,28,36,.35);z-index:8}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--paper);border-radius:22px 22px 0 0;z-index:9;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
#sheet header{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
#sheet header small{color:var(--mute);font-size:13px;display:block}
#sheet header h3{font-size:24px}
#log{flex:1;overflow-y:auto;padding:12px 18px;display:grid;gap:10px;align-content:start}
.b{animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.b.n{color:var(--ink)}
.b.s{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.b.s .nm{font-size:13px;font-weight:700;color:#fff;background:var(--c,#8a96a0);border-radius:999px;padding:3px 10px;margin-top:6px;white-space:nowrap}
.b.s .say{background:#f1ede4;border-radius:4px 16px 16px 16px;padding:8px 14px}
.b.t{background:var(--soft);border:2px dashed var(--accent);border-radius:22px;padding:8px 16px 8px 44px;position:relative}
.b.t::before{content:"💭";position:absolute;left:12px;top:7px;font-size:20px}
.b.o{background:#fde7e2;border-left:6px solid var(--warn);border-radius:8px;padding:10px 14px;font-weight:700}
.b.info{background:#fff6dc;border-radius:12px;padding:12px 14px;border:1px solid #efd38a}
.b.info b{display:block;margin-bottom:2px}
.b.you{justify-self:end;background:var(--accent);color:#fff;border-radius:16px 4px 16px 16px;padding:8px 14px;font-weight:700;max-width:85%}
.b.delta{font-size:13px;color:var(--mute);text-align:center}
#ctrl{padding:10px 18px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:10px}
#ctrl .q{font-weight:700;font-size:15px;color:var(--mute)}
.op{min-height:54px;text-align:left;padding:10px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;font-weight:700;font-size:16px;line-height:1.5}
.op:hover{background:var(--soft)}
#next{justify-self:end}

/* end */
#end .wrap{max-width:820px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stats div{background:var(--paper);border-radius:14px;padding:14px;border:2px solid var(--line)}
.stats b{display:block;font-size:28px;color:var(--accent);font-family:var(--display);font-weight:400}
table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:14px;overflow:hidden;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#ece7dd;font-size:14px}
.moments{display:grid;gap:12px;margin:12px 0;padding:0;list-style:none}
.moments li{background:var(--paper);border-radius:14px;padding:14px 16px;border:2px solid var(--line);display:grid;gap:4px}
.moments h4{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.moments p{margin:0}
.moments .did{color:var(--mute);font-size:14px}
.moments .do{color:var(--ok);font-weight:500}
.moments .do::before{content:"同學可以：";font-weight:700}
.reveal{background:var(--ink);color:#f5efe4;border-radius:20px;padding:22px 20px;margin:24px 0}
.reveal h2{font-size:28px;margin-bottom:6px}
.reveal p{margin:8px 0}
section{margin:26px 0}
section>h2{font-size:26px;margin-bottom:8px}
.qs{padding-left:22px}
.qs li{margin:6px 0}
@media (max-width:560px){
  .hud{gap:6px 8px;padding-left:10px;padding-right:10px}
  .hud .clock{display:none}
  .ibtn{min-width:40px;min-height:36px}
  .meter{flex-basis:100%;order:5}
  #sheet{max-height:84vh}
  #sheet header h3{font-size:21px}
  th,td{padding:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-lv="pr">

<!-- ============ 開始畫面 ============ -->
<div class="scr" id="start">
  <div class="wrap">
    <div class="hero">
      <h1>同一間教室</h1>
      <p>換一顆腦袋，過同一天</p>
    </div>
    <div class="chars" id="chars"></div>
    <div class="row" style="justify-content:center">
      <button class="btn alt" id="toWarm">先暖身：同一句話</button>
    </div>
    <p class="note" style="margin-top:20px">你會變成四年二班的一位同學，過他的一個早上。一位大約 8 分鐘。<br>玩完以後，可以用「支持模式」再過一次同一天，比比看哪裡不一樣。<br>角色和情境都是虛構的，不代表班上任何一位同學。</p>
    <div class="foot">本遊戲由Peiching開發，角色與情境均為虛構<br>「換環境再玩一次」的設計參考《認識多元的世界》（chuoneone，CC BY 4.0）</div>
  </div>
</div>

<!-- ============ 暖身 ============ -->
<div class="scr" id="warm" hidden>
  <div class="wrap">
    <button class="btn alt small" data-go="start">← 回首頁</button>
    <h2 style="font-size:32px;margin-top:16px">暖身：同一句話</h2>
    <p>老師在講台上說了一句話。同一句話，傳到不同的人腦袋裡，會變成什麼？</p>
    <div class="board">這一題，大家再算一次。</div>
    <div class="tabs" id="wtabs">
      <button data-w="most" aria-pressed="true">大部分同學</button>
      <button data-w="pr">品睿</button>
      <button data-w="kq">可晴</button>
    </div>
    <div class="cloud" id="wcloud"></div>
    <p class="note" id="wnote"></p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-go="start">去選角色 ▶</button></div>
  </div>
</div>

<!-- ============ 角色介紹 ============ -->
<div class="scr" id="intro" hidden><div class="wrap" id="introBody"></div></div>

<!-- ============ 遊戲 ============ -->
<div id="game" hidden>
  <div class="hud">
    <div class="who"><i></i><span id="hWho">你是品睿</span></div>
    <div class="clock" id="hClock">08:10</div>
    <div class="mode" id="hMode">體驗模式</div>
    <div class="meter"><b id="hMName">坐不住</b><div class="bar"><i id="hBar"></i></div><span id="hWord">平靜</span></div>
    <button class="ibtn" id="sndBtn" style="margin-left:auto" aria-label="聲音" aria-pressed="true">🔊</button>
    <button class="ibtn" id="homeBtn" aria-label="回首頁">🏠</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="banner"></div></div>
  <div class="goalbar">
    <div class="g" id="goal">走到 <b>你的座位</b></div>
    <button class="btn small" id="walkBtn">走過去 ▶</button>
  </div>
</div>
<div id="shade" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <header><small id="shTime"></small><h3 id="shTitle"></h3></header>
  <div id="log" aria-live="polite"></div>
  <div id="ctrl"></div>
</div>

<!-- ============ 結算 ============ -->
<div class="scr" id="end" hidden><div class="wrap" id="endBody"></div></div>

<script>
/* =====================================================================
   設定區（劇本與參數）。改台詞、改時刻、改支持做法，都只動這一段。
   每個時刻 moment：
     at/spot   地點與要走到的格子；from 開始時把玩家放到某格
     time goal  畫面上方時間、下方目標
     sim / sup  體驗模式、支持模式各一份：
                cast 出現的人 [名字,x,y]；beats 劇情；gain 心情增加量；ops 選項
     beats 寫法：['n',旁白] ['s',誰,說的話] ['t',念頭] ['if',旗標,beat]
     ops 寫法：{l:選項文字, r:[結果 beats], d:數值變化, f:設定旗標}
     why / peer / stuck / other  結算頁用：為什麼、同學可以、卡住的事、另一面
   ===================================================================== */
const PEOPLE={
  '林老師':'#5b72b0','王老師':'#b0784a','宥辰':'#3a8f5c','子涵':'#c9852b','芊芊':'#9a5fb0',
  '導護老師':'#6d6a75','同學':'#8a96a0','後面的同學':'#8a96a0','旁邊的同學':'#8a96a0'
};
const CFG={
  sim:{name:'體驗模式',gainMult:1,rest:5,thoughtEvery:4.5},
  sup:{name:'支持模式',gainMult:.8,rest:10,thoughtEvery:11}
};
const LEVELS={
pr:{
  name:'品睿',face:'睿',color:'#2f8f9d',shirt:'#2f8f9d',
  tagline:'數學很快、問題很多，字寫得很慢。',
  title:'想得太快的一天',
  intro:['今天你是品睿，四年二班 17 號。','你很喜歡恐龍和數學，腦袋裡隨時有好幾個問題在轉。你的字寫得很慢，體育普通，也不太會聊大家在玩的卡牌。'],
  meter:{name:'坐不住',start:20,words:[[35,'平靜'],[60,'有點悶'],[85,'坐不住了'],[101,'快受不了']],explain:'已經會的東西一直重複、想說的話沒人聽、被誤會，這條就會往上升。滿了就會爆發。'},
  overload:{
    beats:[['o','你突然大聲說：「好無聊喔！我不要再等了！」'],['n','教室一下子安靜下來，大家都轉頭看你。'],['s','同學','他好奇怪喔。'],['t','我也不想這樣……可是我真的忍不住了。']],
    info:'「坐不住」的感覺一直累積，找不到出口，最後一次爆出來。旁邊的人只看到最後那一句話，看不到前面累積了多久。'
  },
  thoughts:{
    sim:['24×15 還有別的算法嗎？','如果月亮突然不見會怎樣？','走廊的磁磚一塊幾公分？','恐龍會不會其實是彩色的？','好想快點去看那本恐龍書','我剛剛是不是講太多了？','為什麼要等這麼久？'],
    sup:['挑戰卡還有第二張嗎？','下課要問老師小數的事','恐龍會不會其實是彩色的？']
  },
  support:['已經會的人，可以拿講桌上的挑戰卡','想到問題可以先貼在「問題停車場」','小組討論時，每個人輪流說一個想法','回原班時，小老師會留紙條給你','寫作文可以先用說的，再挑重點寫','下課時，有同學會問你在看什麼書'],
  moments:[
  {id:'math',time:'08:40 第一節・數學',goal:'回到你的座位',from:[29,10],spot:[4,4],title:'講第三遍的數學課',
   sim:{cast:[['林老師',6,2],['子涵',6,4]],gain:20,beats:[
     ['n','林老師在黑板上寫 24×15。'],
     ['s','林老師','這題我們再用直式算一次，這是第三次囉，大家跟著我。'],
     ['t','24×15，就是 24×10 加 24×5，等於 360。我第一次就算好了。'],
     ['t','如果是 24×1.5 呢？好想知道小數乘法怎麼算。'],
     ['n','隔壁的子涵還在抄第一行。']],
    ops:[
     {l:'舉手問：「老師，如果是 24×1.5 呢？」',d:10,r:[['s','林老師','品睿，這個以後才會教，先跟大家一起算。'],['n','後面有人小聲說：「又來了。」'],['t','我只是想知道而已。']]},
     {l:'忍住，在課本邊邊畫一隻恐龍',d:5,r:[['s','林老師','品睿，眼睛看黑板。'],['t','我有在聽啊，我只是已經會了。']]},
     {l:'偷偷翻到下一頁先寫',d:-10,f:'missed',r:[['n','你一口氣寫完 6 題，好舒服。'],['n','可是老師剛剛說「第 4 題不用寫」，你沒聽到。']]}]},
   sup:{cast:[['林老師',6,2],['子涵',6,4]],gain:20,beats:[
     ['n','林老師在黑板上寫 24×15。'],
     ['s','林老師','這題我們再算一次。已經會的人，可以拿講桌上的挑戰卡。'],
     ['t','挑戰卡！'],
     ['n','卡片上寫著：「24×15＝360。不用直式，你能想出幾種算法？」']],
    ops:[
     {l:'拿挑戰卡，想第三種算法',d:-15,r:[['n','你想到 25×15 再減 15。寫完的時候，全班剛好算完。'],['t','原來還可以這樣拆！']]},
     {l:'把問題寫在「問題停車場」',d:-10,r:[['n','你在便利貼寫「24×1.5 怎麼算？」，貼在黑板旁邊。'],['s','林老師','好問題，下課跟你聊。']]},
     {l:'跟大家一起算，當作檢查',d:-5,r:[['t','算第三次也可以，至少確定沒算錯。']]}]},
   stuck:'老師講第三遍時，一直想問新問題',other:'很快看出算法的規律，還會自己想新問題',
   why:'已經會的東西一直重複，大腦會像沒東西吃一樣，悶到坐不住。他問問題、畫畫，常常是在替大腦找事情做。',
   peer:'他提問時，不要說「又來了」。'},
  {id:'group',time:'09:30 第二節・自然',goal:'去教室後面跟組員會合',spot:[10,7],title:'紙杯電話小組',

  const sp=4.2*dt;P.moving=false;
  if(dx||dy){path=null;const L=Math.hypot(dx,dy);dx=dx/L*sp;dy=dy/L*sp;if(!blocked(P.x+dx,P.y,.28))P.x+=dx;if(!blocked(P.x,P.y+dy,.28))P.y+=dy;P.moving=true;P.fx=Math.sign(dx)}
  else if(path&&path.length){const [tx,ty]=path[0],gx=tx+.5,gy=ty+.5,ddx=gx-P.x,ddy=gy-P.y,d=Math.hypot(ddx,ddy);
    if(d<=sp){P.x=gx;P.y=gy;path.shift()}else{P.x+=ddx/d*sp;P.y+=ddy/d*sp}P.moving=true;P.fx=Math.sign(ddx)}
  if(P.moving)walkT+=dt*6;
  // 念頭
  S.thoughtT-=dt;if(S.thought){S.thought.t-=dt;if(S.thought.t<=0)S.thought=null}
  if(S.thoughtT<=0){S.thought={text:pick(LV().thoughts[S.mode]),t:3.2};S.thoughtT=C().thoughtEvery+Math.random()*2}
  // 到達
  const [sx,sy]=targetTile();if(!S.arrived&&Math.hypot(P.x-(sx+.5),P.y-(sy+.5))<.75){S.arrived=true;path=null;playScene()}
}
function draw(){
  const cv=$('cv'),g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle='#c9c2b4';g.fillRect(0,0,cv.width,cv.height);
  if(!S||!STATIC)return;
  const WW=MW*TS,WH=MH*TS,vw=cvW/zoom,vh=cvH/zoom;
  let tx=P.x*TS-vw/2,ty=P.y*TS-vh/2;tx=vw>=WW?(WW-vw)/2:clamp(tx,0,WW-vw);ty=vh>=WH?(WH-vh)/2:clamp(ty,0,WH-vh);
  if(Math.abs(tx-camX)>400||Math.abs(ty-camY)>400){camX=tx;camY=ty}else{camX+=(tx-camX)*.15;camY+=(ty-camY)*.15}
  g.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);g.drawImage(STATIC,0,0);
  const now=performance.now()/1000,mo=MO();
  // 目標
  if(!S.arrived){const [sx,sy]=mo.spot,pulse=.5+.5*Math.sin(now*5),cx=sx*TS+16,cy=sy*TS+16;
    g.strokeStyle=`rgba(242,181,58,${.5+.5*pulse})`;g.lineWidth=4;g.beginPath();g.arc(cx,cy,12+pulse*4,0,7);g.stroke();
    g.fillStyle='#f2b53a';g.font='20px sans-serif';g.textAlign='center';g.fillText('⭐',cx,cy-20-Math.sin(now*4)*3)}
  // 坐著的同學（教室）
  const ents=[];
  const castNames=new Set((mo[S.mode].cast||[]).map(c=>c[0]));
  SITTERS.forEach(([x,y],i)=>{if(S.lv==='pr'&&S.mi===3&&S.mode==='sim'&&i===0)return;ents.push({y:y+.3,f:()=>{drawPerson(g,x*TS+16,y*TS+10,{shirt:'#f4f4f0',hair:HAIRS[i%4],long:i%3===1});g.fillStyle='#b98a55';g.fillRect(x*TS+3,y*TS+14,TS-6,TS-20)}})});
  (mo[S.mode].cast||[]).forEach(([n,x,y],i)=>{const c=PEOPLE[n]||'#8a96a0',adult=/老師/.test(n);ents.push({y:y+.5,f:()=>drawPerson(g,x*TS+16,y*TS+16,{shirt:c,pants:adult?'#3b3a44':'#2c3a66',hair:HAIRS[(i+1)%4],long:/子涵|芊芊/.test(n),label:n,labelBg:c})})});
  ents.push({y:P.y,f:()=>drawPerson(g,P.x*TS,P.y*TS,{moving:P.moving,walk:walkT,shirt:LV().shirt,hair:'#2a211c',long:S.lv==='kq',fx:P.fx,label:'你・'+LV().name,labelBg:LV().color})});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  if(S.thought&&!S.inScene)cloud(g,P.x*TS,P.y*TS-6,S.thought.text,LV().color,Math.min(1,S.thought.t*2,(3.2-S.thought.t)*3));
  // 方向箭頭（目標在畫面外）
  g.setTransform(dpr,0,0,dpr,0,0);
  if(!S.arrived){const [sx,sy]=mo.spot,gx=((sx+.5)*TS-camX)*zoom,gy=((sy+.5)*TS-camY)*zoom;
    if(gx<0||gx>cvW||gy<0||gy>cvH){const px=(P.x*TS-camX)*zoom,py=(P.y*TS-camY)*zoom,a=Math.atan2(gy-py,gx-px);
      const ax=clamp(px+Math.cos(a)*Math.min(cvW,cvH)*.38,26,cvW-26),ay=clamp(py+Math.sin(a)*Math.min(cvW,cvH)*.38,26,cvH-26);
      g.save();g.translate(ax,ay);g.rotate(a);g.fillStyle='#f2b53a';g.strokeStyle='#2b2a33';g.lineWidth=2;g.beginPath();g.moveTo(18,0);g.lineTo(-11,-12);g.lineTo(-5,0);g.lineTo(-11,12);g.closePath();g.fill();g.stroke();g.restore()}}
}
function resize(){const st=$('stage');if(!st||$('game').hidden)return;const r=st.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cvW=Math.max(1,r.width);cvH=Math.max(1,r.height);
  const cv=$('cv');cv.width=Math.round(cvW*dpr);cv.height=Math.round(cvH*dpr);
  const fit=Math.min(cvW/(MW*TS),cvH/(MH*TS));zoom=fit>=.85?fit:clamp(Math.min(cvW/(11*TS),cvH/(9*TS)),.8,1.4)}
function frame(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!paused)update(dt);draw();requestAnimationFrame(frame)}

/* ---------- 劇情 ---------- */
let tapResolve=null;
function waitTap(label='繼續 ▶'){return new Promise(res=>{const c=$('ctrl');c.innerHTML=`<button class="btn" id="next">${label}</button>`;tapResolve=()=>{tapResolve=null;res()};$('next').onclick=()=>tapResolve&&tapResolve();$('next').focus({preventScroll:true})})}
function addBeat(b){
  const log=$('log'),el=document.createElement('div');
  if(b[0]==='n'){el.className='b n';el.textContent=b[1]}
  else if(b[0]==='s'){el.className='b s';el.style.setProperty('--c',PEOPLE[b[1]]||'#8a96a0');el.innerHTML=`<span class="nm">${esc(b[1])}</span><span class="say">${esc(b[2])}</span>`}
  else if(b[0]==='t'){el.className='b t';el.textContent=b[1]}
  else if(b[0]==='o'){el.className='b o';el.textContent=b[1]}
  else if(b[0]==='info'){el.className='b info';el.innerHTML=`<b>${esc(b[1])}</b>${esc(b[2])}`}
  else if(b[0]==='you'){el.className='b you';el.textContent=b[1]}
  else if(b[0]==='delta'){el.className='b delta';el.textContent=b[1]}
  log.appendChild(el);el.scrollIntoView({block:'end',behavior:REDUCE?'auto':'smooth'});AU.blip()}
async function beats(list){for(const b of list){if(b[0]==='if'){if(S.flags[b[1]]){addBeat(b[2]);await waitTap()}continue}addBeat(b);await waitTap()}}
async function bump(d){
  if(!d)return;S.m=clamp(S.m+d,0,100);S.peak=Math.max(S.peak,S.m);hud();
  const w=wordOf(S.m);addBeat(['delta',`${LV().meter.name}${d>0?'升高':'降低'}了・現在：${w}`]);d>0?AU.down():AU.up();
  if(S.m>=100){await overload()}}
async function overload(){
  S.over++;AU.boom();if(!REDUCE){const st=$('sheet');st.animate([{transform:'translateX(-50%)'},{transform:'translateX(calc(-50% - 6px))'},{transform:'translateX(calc(-50% + 6px))'},{transform:'translateX(-50%)'}],{duration:350,iterations:2})}
  const ov=LV().overload;for(const b of ov.beats){addBeat(b);await waitTap()}
  if(S.firstOver){S.firstOver=false;addBeat(['info','剛剛發生的事',ov.info]);await waitTap()}
  S.m=60;hud();addBeat(['delta',`過了好一陣子，你才慢慢平靜一點。${LV().meter.name}：${wordOf(S.m)}`])}
function askOptions(ops){return new Promise(res=>{const c=$('ctrl');c.innerHTML='<div class="q">你會怎麼做？</div>'+ops.map((o,i)=>`<button class="op" data-i="${i}">${esc(o.l)}</button>`).join('');
  c.querySelectorAll('.op').forEach(b=>b.onclick=()=>res(ops[+b.dataset.i]));c.querySelector('.op').focus({preventScroll:true})})}
async function playScene(){
  S.inScene=true;P.moving=false;const mo=MO(),v=MV();
  $('shTime').textContent=mo.time;$('shTitle').textContent=mo.title;$('log').innerHTML='';$('ctrl').innerHTML='';
  $('shade').hidden=false;$('sheet').hidden=false;
  await beats(v.beats);
  await bump(Math.round(v.gain*C().gainMult));
  const op=await askOptions(v.ops);
  addBeat(['you',op.l]);S.picks.push({id:mo.id,l:op.l});if(op.f)S.flags[op.f]=true;
  await beats(op.r);
  await bump(op.d);
  const lastOne=S.mi===LV().moments.length-1;
  await waitTap(lastOne?'這一天結束了 ▶':'繼續這一天 ▶');
  $('sheet').hidden=true;$('shade').hidden=true;S.inScene=false;
  if(lastOne)finish();else startMoment(S.mi+1)}

/* ---------- 結算 ---------- */
function finish(){
  running=false;const L=LV(),run={peak:S.peak,over:S.over,end:S.m,picks:S.picks};
  SAVE.done[S.lv]=SAVE.done[S.lv]||{};SAVE.done[S.lv][S.mode]=1;SAVE.runs[S.lv]=SAVE.runs[S.lv]||{};SAVE.runs[S.lv][S.mode]={peak:S.peak,over:S.over,end:S.m};store.set(SAVE);
  const R=SAVE.runs[S.lv],both=R.sim&&R.sup,other=S.lv==='pr'?'kq':'pr',mn=L.meter.name;
  const W=v=>L.meter.words.find(([t])=>v<t)[1];
  const cmp=both?`<section><h2>兩次比一比</h2><table><tr><th>同一天</th><th>體驗模式</th><th>支持模式</th></tr>
    <tr><td>爆發幾次</td><td>${R.sim.over} 次</td><td>${R.sup.over} 次</td></tr>
    <tr><td>${mn}最高到</td><td>${W(R.sim.peak)}</td><td>${W(R.sup.peak)}</td></tr>
    <tr><td>一天結束時</td><td>${W(R.sim.end)}</td><td>${W(R.sup.end)}</td></tr></table>
    <p class="note" style="margin-top:10px">${L.name}還是同一個人。換了座位以外的東西：老師的說法、同學的一句話、班上的規則。</p></section>`:'';
  const ms=L.moments.map(m=>{const p=run.picks.find(x=>x.id===m.id);return `<li><h4>${esc(m.title)}</h4><p class="did">你選了：${esc(p?p.l:'—')}</p><p>${esc(m.why)}</p><p class="do">${esc(m.peer)}</p></li>`}).join('');
  const sideRows=L.moments.map(m=>`<tr><td>${esc(m.stuck)}</td><td>${esc(m.other)}</td></tr>`).join('');
  const sup=S.mode==='sim'?`<section><h2>支持模式會改變什麼</h2><p>同一天再過一次，這一次老師和同學會做這些調整：</p><ul>${L.support.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:'';
  $('endBody').innerHTML=`
    <p style="color:var(--mute);margin:8px 0 0">${esc(C().name)}・${esc(L.title)}</p>
    <h1 style="font-size:40px">${esc(L.name)}的早上結束了</h1>
    <div class="stats"><div><b>${run.over} 次</b>爆發</div><div><b>${W(run.peak)}</b>${mn}最高到</div><div><b>${W(run.end)}</b>一天結束時</div></div>
    ${cmp}
    <section><h2>今天你遇到的時刻</h2><ul class="moments">${ms}</ul></section>
    <section><h2>同一件事的另一面</h2><table><tr><th>剛才讓你卡住的</th><th>同一件事的另一面</th></tr>${sideRows}</table></section>
    ${sup}
    <div class="reveal"><h2>${esc(LEVELS.pr.name)}和${esc(LEVELS.kq.name)}是誰？</h2>${REVEAL.map(p=>`<p>${p}</p>`).join('')}</div>
    <section><h2>想一想，和同學聊一聊</h2><ol class="qs">${L.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></section>
    <div class="row" style="margin:24px 0">
      ${S.mode==='sim'?`<button class="btn" data-act="sup">用支持模式再過一次 ▶</button>`:`<button class="btn" data-act="sim">再玩一次體驗模式</button>`}
      <button class="btn alt" data-act="other">換成${esc(LEVELS[other].name)}</button>
      <button class="btn alt" data-go="start">回首頁</button>
    </div>`;
  const lv=S.lv;$('endBody').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='other')openIntro(other);else openIntro(lv,a)});
  bindGo($('endBody'));showScreen('end');$('end').scrollTop=0}

/* ---------- 畫面切換 ---------- */
function showScreen(id){['start','warm','intro','game','end'].forEach(s=>$(s).hidden=s!==id);if(id!=='game'){running=false;$('sheet').hidden=true;$('shade').hidden=true}if(id==='start')renderStart()}
function bindGo(root){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showScreen(b.dataset.go))}
function renderStart(){
  $('chars').innerHTML=['pr','kq'].map(k=>{const L=LEVELS[k],d=SAVE.done[k]||{};return `<div class="char"><div class="face" style="background:${L.color}">${L.face}</div>
    <h2>${esc(L.name)}</h2><p class="lvl" style="color:${L.color}">${esc(L.title)}</p><p class="sub">${esc(L.tagline)}</p>
    <div class="badges"><span class="badge ${d.sim?'on':''}">${d.sim?'✓ ':''}體驗模式</span><span class="badge ${d.sup?'on':''}">${d.sup?'✓ ':''}支持模式</span></div>
    <button class="btn" style="background:${L.color}" data-lv="${k}">變成${esc(L.name)} ▶</button></div>`}).join('');
  $('chars').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>openIntro(b.dataset.lv))}
function openIntro(lv,mode){
  const L=LEVELS[lv],d=SAVE.done[lv]||{};mode=mode||(d.sim&&!d.sup?'sup':'sim');document.body.dataset.lv=lv;
  const body=mode==='sim'?`<h2>${esc(L.title)}</h2>${L.intro.map(p=>`<p>${esc(p)}</p>`).join('')}
    <div class="meterDemo"><b>${esc(L.meter.name)}</b><div class="bar" style="max-width:220px"><i style="width:30%"></i></div></div>
    <p>${esc(L.meter.explain)}</p>
    <p>雲朵框 💭 是你心裡在想的話，別人聽不到。</p>
    <ul><li>點地圖上的地方就會走過去，或按下面的「走過去」。</li><li>電腦也可以用 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 或方向鍵走路。</li><li>走到 ⭐，就會發生今天的事。</li></ul>`
   :`<h2>同一天，換一種環境</h2><p>你還是${esc(L.name)}，還是同一天。這一次，老師和同學做了一些調整：</p><ul>${L.support.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p>看看${esc(L.meter.name)}會有什麼不一樣。</p>`;
  $('introBody').innerHTML=`<button class="btn alt small" data-go="start">← 回首頁</button>
    <div class="card"><p class="mode" style="display:inline-block">${esc(CFG[mode].name)}</p>${body}</div>
    <div class="row" style="justify-content:flex-end">${mode==='sim'&&d.sim?`<button class="btn alt" data-m="sup">改玩支持模式</button>`:''}${mode==='sup'?`<button class="btn alt" data-m="sim">改玩體驗模式</button>`:''}<button class="btn" id="goPlay">開始這一天 ▶</button></div>`;
  bindGo($('introBody'));$('goPlay').onclick=()=>newRun(lv,mode);
  $('introBody').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openIntro(lv,b.dataset.m));
  showScreen('intro');$('intro').scrollTop=0}
function renderWarm(k){const w=WARM[k];$('wcloud').style.setProperty('--c',w.c);$('wcloud').innerHTML=w.t.map(t=>`<p>${esc(t)}</p>`).join('');$('wnote').textContent=w.n;
  $('wtabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===k?'true':'false'))}

/* ---------- 輸入 ---------- */
function bindInput(){
  addEventListener('keydown',e=>{
    if(!$('sheet').hidden){if((e.key==='Enter'||e.key===' ')&&tapResolve&&document.activeElement&&document.activeElement.id!=='next'){e.preventDefault();tapResolve()}return}
    if($('game').hidden)return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d'].includes(k)){keys[k]=true;e.preventDefault()}});
  addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
  addEventListener('blur',()=>keys={});
  $('cv').addEventListener('pointerdown',e=>{if(!S||S.inScene)return;AU.init();const r=$('cv').getBoundingClientRect(),wx=((e.clientX-r.left)/zoom+camX)/TS,wy=((e.clientY-r.top)/zoom+camY)/TS;
    let tx=Math.floor(wx),ty=Math.floor(wy);if(!walk(tx,ty)){let best=null,bd=9;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(walk(tx+i,ty+j)){const dd=Math.hypot(i,j);if(dd<bd){bd=dd;best=[tx+i,ty+j]}}if(!best)return;[tx,ty]=best}goTo(tx,ty)});
  $('walkBtn').onclick=()=>{AU.init();const [x,y]=targetTile();goTo(x,y)};
  $('sndBtn').onclick=()=>{AU.init();AU.set(!AU.on);$('sndBtn').textContent=AU.on?'🔊':'🔇';$('sndBtn').setAttribute('aria-pressed',AU.on?'true':'false')};
  $('homeBtn').onclick=()=>showScreen('start');
  $('toWarm').onclick=()=>{renderWarm('most');showScreen('warm')};
  $('wtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>renderWarm(b.dataset.w));
  bindGo(document);addEventListener('resize',resize)}

STATIC=buildStatic();bindInput();$('sndBtn').textContent=AU.on?'🔊':'🔇';showScreen('start');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{STATIC=buildStatic()});
/* 測試用：自動跑時把玩家直接放到目標 */
window.__SC={state:()=>S,warp(){if(!S)return;const [x,y]=targetTile();P.x=x+.5;P.y=y+.5},bfs,walk,LEVELS,MW,MH};
</script>
