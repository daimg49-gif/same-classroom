<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同一間教室</title>
<meta name="description" content="2D 校園體驗遊戲：變成四年甲班的一位資優生，過他的一個早上。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f5efe4;--paper:#fffdf8;--ink:#2b2a33;--mute:#6d6a75;--line:rgba(43,42,51,.14);
  --pr:#2f8f9d;--pr-soft:#dff0f1;--kq:#d9694b;--kq-soft:#fbe5dc;--sh:#6f5cc4;--sh-soft:#e9e5f8;
  --accent:var(--pr);--soft:var(--pr-soft);
  --warn:#c8432f;--ok:#2f7d55;--gold:#f2b53a;
  --display:"Iansui","Kaiti TC","DFKai-SB",serif;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:light;
}
body[data-lv="kq"]{--accent:var(--kq);--soft:var(--kq-soft)}
body[data-lv="sh"]{--accent:var(--sh);--soft:var(--sh-soft)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.7 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.scr{position:fixed;inset:0;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.alt{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{min-height:44px;padding:6px 14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* start */
#start .hero{text-align:center;padding:24px 0 8px}
#start .hero h1{font-size:clamp(44px,9vw,76px);letter-spacing:.08em}
#start .hero p{margin:6px 0 0;color:var(--mute);font-size:18px}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0}
.char{background:var(--paper);border-radius:20px;padding:20px;border:2px solid var(--line);display:grid;gap:10px;align-content:start;text-align:left}
.char .face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;font-family:var(--display)}
.char h2{font-size:28px}
.char .sub{color:var(--mute);margin:0}
.char .lvl{font-weight:700;margin:0}
.char .btn{align-self:end}
.badge{justify-self:start;font-size:13px;padding:2px 10px;border-radius:999px;background:#ece7dd;color:var(--mute)}
.badge.on{background:var(--ok);color:#fff}
.note{background:var(--paper);border-radius:14px;padding:12px 16px;color:var(--mute);font-size:15px;border:1px dashed var(--line)}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--mute);line-height:1.8}

/* warm-up */
.board{background:#2f4f43;color:#f4f1e6;border-radius:16px;padding:28px 20px;text-align:center;font-family:var(--display);font-size:clamp(26px,5vw,38px);border:10px solid #8a6a48;margin:20px 0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tabs button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cloud{position:relative;margin:22px 0;background:#fff;border:2px dashed var(--c,#8a96a0);border-radius:26px;padding:18px 20px;font-size:18px;min-height:96px}
.cloud::before{content:"💭";position:absolute;top:-18px;left:18px;font-size:26px}
.cloud p{margin:0 0 6px}

/* intro */
.card{background:var(--paper);border-radius:20px;padding:24px 20px;border:2px solid var(--line);margin:20px 0}
.card h2{font-size:32px;margin-bottom:8px}
.card ul{margin:8px 0;padding-left:22px}
.key{display:inline-block;min-width:26px;text-align:center;font-size:13px;font-weight:700;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 6px;background:#fff}
.meterDemo{display:flex;align-items:center;gap:10px;margin:8px 0}

/* game */
#game{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:#c9c2b4}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:var(--paper);border-bottom:2px solid var(--line);z-index:3}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.who i{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.clock{color:var(--mute);font-size:14px}
.meter{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:200px}
.meter b{font-size:14px;white-space:nowrap}
.bar{flex:1;height:14px;border-radius:999px;background:#ece7dd;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:20%;background:var(--accent);border-radius:999px;transition:width .6s,background .6s}
.meter span{font-size:14px;min-width:5em;color:var(--mute)}
.ibtn{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff}
#stage{position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#banner{position:absolute;left:50%;top:14px;transform:translate(-50%,-20px);opacity:0;transition:.4s;background:rgba(43,42,51,.88);color:#fff;border-radius:999px;padding:8px 18px;font-size:15px;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#banner.on{opacity:1;transform:translate(-50%,0)}
.goalbar{display:flex;align-items:center;gap:10px;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--paper);border-top:2px solid var(--line);z-index:3}
.goalbar .g{flex:1;font-size:15px}
.goalbar .g b{color:var(--accent)}

/* scene sheet */
#shade{position:fixed;inset:0;background:rgba(30,28,36,.35);z-index:8}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--paper);border-radius:22px 22px 0 0;z-index:9;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
#sheet header{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
#sheet header small{color:var(--mute);font-size:13px;display:block}
#sheet header h3{font-size:24px}
#log{flex:1;overflow-y:auto;padding:12px 18px;display:grid;gap:10px;align-content:start}
.b{animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.b.s{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.b.s .nm{font-size:13px;font-weight:700;color:#fff;background:var(--c,#8a96a0);border-radius:999px;padding:3px 10px;margin-top:6px;white-space:nowrap}
.b.s .say{background:#f1ede4;border-radius:4px 16px 16px 16px;padding:8px 14px}
.b.t{background:var(--soft);border:2px dashed var(--accent);border-radius:22px;padding:8px 16px 8px 44px;position:relative}
.b.t::before{content:"💭";position:absolute;left:12px;top:7px;font-size:20px}
.b.o{background:#fde7e2;border-left:6px solid var(--warn);border-radius:8px;padding:10px 14px;font-weight:700}
.b.info{background:#fff6dc;border-radius:12px;padding:12px 14px;border:1px solid #efd38a}
.b.info b{display:block;margin-bottom:2px}
.b.you{justify-self:end;background:var(--accent);color:#fff;border-radius:16px 4px 16px 16px;padding:8px 14px;font-weight:700;max-width:85%}
.b.delta{font-size:13px;color:var(--mute);text-align:center}
#ctrl{padding:10px 18px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:10px}
#ctrl .q{font-weight:700;font-size:15px;color:var(--mute)}
.op{min-height:54px;text-align:left;padding:10px 16px;border-radius:14px;border:2px solid var(--accent);background:#fff;font-weight:700;font-size:16px;line-height:1.5}
.op:hover{background:var(--soft)}
#next{justify-self:end}

/* end */
#end .wrap{max-width:820px}
section{margin:28px 0}
section>h2{font-size:28px;margin-bottom:10px}
.chartBox{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:16px 16px 10px}
.chartBox .head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:6px}
.chartBox .head b{font-size:17px}
.chartBox .head span{color:var(--mute);font-size:14px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--body)}
.chart .bar:hover,.chart .bar:focus{opacity:.8}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;max-width:220px}
details.mo{background:var(--paper);border:2px solid var(--line);border-radius:14px;margin:8px 0}
details.mo summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;list-style:none;min-height:52px}
details.mo summary::-webkit-details-marker{display:none}
details.mo summary::after{content:"＋";margin-left:auto;color:var(--mute);font-weight:700}
details.mo[open] summary::after{content:"－"}
details.mo summary .t{font-weight:700}
details.mo summary .pk{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
details.mo summary .pk.hot{background:#fde7e2;color:var(--warn)}
details.mo .in{padding:0 16px 14px;display:grid;gap:6px}
details.mo .in p{margin:0}
details.mo .did{color:var(--mute);font-size:14px}
details.mo .do{color:var(--ok);font-weight:500}
details.mo .do::before{content:"同學可以：";font-weight:700}
.who2{background:var(--ink);color:#f5efe4;border-radius:22px;padding:24px 20px}
.who2 h2{font-size:30px}
.who2 p{margin:8px 0}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.traits div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px}
.traits b{display:block;margin-bottom:4px}
.traits ul{margin:0;padding-left:20px}
.why{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none;counter-reset:w}
.why li{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px 10px 48px;position:relative;counter-increment:w}
.why li::before{content:counter(w);position:absolute;left:14px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:900;display:grid;place-items:center;font-size:14px}
.why li b{display:block}
.mask{background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 14px;margin-top:12px}
.view{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.view li{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.view li b{display:block}
.say2{width:100%;border-collapse:collapse;background:var(--paper);border-radius:14px;overflow:hidden;font-size:15px;margin-top:12px}
.say2 th,.say2 td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.say2 th{background:#ece7dd;font-size:14px}
.say2 td:first-child{color:var(--warn)}
.say2 td:last-child{color:var(--ok)}
.qs{padding-left:22px}
.qs li{margin:6px 0}

/* 切身感知特效 */
#fxl{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}
.fw{position:absolute;font-weight:900;white-space:nowrap;animation:fw 2.4s both;color:var(--ink);line-height:1.2}
@keyframes fw{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}80%{opacity:.9}100%{opacity:0;transform:scale(1.15)}}
.fw.idea{pointer-events:auto;cursor:pointer;background:#fff;border:2px dashed var(--accent);border-radius:999px;padding:6px 14px;font-size:16px!important;font-weight:700;color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.12);animation-duration:2.6s}
.fw.th{color:var(--accent)}
.fw.echo{color:#ffd9cf}.fw.echo.big{font-size:42px!important}.fw.echo.dim{opacity:.55}
.fw.read{color:#d9cff5;font-style:italic;font-weight:700}
.fw.noise{color:#c8432f;text-shadow:0 0 6px #fff}
.fw.noise.flick{animation:fw 2.4s both,flick .12s steps(2) infinite}
@keyframes flick{50%{opacity:.1}}
.eye{position:absolute;animation:eye 1.2s both}
@keyframes eye{from{opacity:0;transform:scale(.3)}}
#sheet.fx-grey #log{filter:grayscale(var(--g,0)) contrast(calc(1 - var(--g,0)*.3))}
#sheet.fx-blur #log .b:not(.you):not(.delta):not(.mg){filter:blur(var(--blur,0))}
#sheet.fx-tilt{rotate:-1.6deg}
#game.fx-tilt #stage{rotate:-1.6deg;scale:1.05}
#sheet.fx-vig{box-shadow:0 -10px 30px rgba(0,0,0,.2),inset 0 0 140px rgba(60,30,40,.45)}
#sheet.fx-shake{animation:shake .25s infinite}
@keyframes shake{0%,100%{translate:0}25%{translate:-4px 0;rotate:-.4deg}75%{translate:4px 0;rotate:.4deg}}
#sheet.fx-muffle #log{filter:blur(1.2px) brightness(.8)}
#sheet.fx-calm{box-shadow:0 0 0 6px #bfe3d6,0 -10px 30px rgba(0,0,0,.2)}
#sheet.fx-calm #log{background:#f4faf7}
.b.mg{border-radius:14px;background:#faf6ee;border:1px solid var(--line);padding:12px;position:relative}
.mg.flood{height:180px;overflow:hidden}
.mg.echo{height:200px;overflow:hidden;background:#2b2a33;transition:opacity 1s}
.mg.echo.fade{opacity:.45}
.b.you.garble{letter-spacing:-.14em;font-size:15px}
.b.you.mumble{display:flex;flex-wrap:wrap;align-items:baseline}
.mg.mirror{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.mg.mirror b{grid-column:1/-1}.mg.mirror canvas{width:120px;height:120px;border-radius:12px;border:1px solid var(--line)}
.mg.mirror ul{margin:0;padding-left:18px;color:var(--warn);font-weight:700}.mg.mirror p{grid-column:1/-1;margin:0}
.mg.board .bb{background:#2f4f43;color:#f4f1e6;border:8px solid #8a6a48;border-radius:10px;padding:10px 16px;font-family:var(--display);font-size:19px;line-height:1.8}
.erased{opacity:.16;filter:blur(2.5px)}
.mg .cap{color:var(--mute);font-size:14px;margin:4px 0 8px}
.mg.write{display:grid;gap:6px}
.mg.write .lab{font-size:13px;font-weight:700;color:var(--mute)}
.mg.write .brain{min-height:58px;font-size:17px;color:var(--accent);background:var(--soft);border-radius:10px;padding:8px 12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%);transition:opacity 1.2s}
.mg.write .brain.gone{opacity:.06}
.mg.write .paper{min-height:72px;background:repeating-linear-gradient(#fff 0 31px,#cfd8e3 31px 32px);border-radius:8px;padding:4px 8px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.mg.write .paper span{display:inline-block;font-family:var(--display);color:#333}
.mg.write .timer{font-size:13px;color:var(--warn);text-align:right;font-weight:700}
.mg canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:none}
.mg.trace.pulse canvas{animation:pul 1s 3}
@keyframes pul{50%{box-shadow:0 0 0 6px rgba(200,67,47,.35)}}
.mg.cues .faces{display:flex;gap:18px;font-size:13px;color:var(--mute)}.mg.cues .faces i{font-style:normal;font-size:14px}
.mg.cues .st{font-size:17px;font-weight:700;color:var(--accent);line-height:1.8}
.op.hold{position:relative;overflow:hidden;display:grid;gap:2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.op.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--soft);z-index:0}
.op.hold .lbl,.op.hold small{position:relative;z-index:1}
.op.hold .lbl span{display:inline-block;opacity:.35}
.op.hold small{font-size:12px;color:var(--mute);font-weight:500}
label.rf{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:12px;cursor:pointer}
label.rf input{width:22px;height:22px}
.credit{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;color:var(--mute);font-size:15px}
.credit a{text-decoration:none}
.char.locked{background:#ece7dd;border-style:dashed;color:var(--mute);place-content:center;text-align:center;min-height:260px}
.char.locked .face{background:#b8b0a3;margin:0 auto}
.diff{display:grid;gap:12px}
.dcard{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:8px}
.dcard>b{font-family:var(--display);font-weight:400;font-size:21px}
.dpick{margin:0;font-size:14px;color:var(--mute)}
.dop{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px}
.dif{font-weight:700;font-size:15px}.dif em{font-style:normal;font-size:12px;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
.dop p{margin:0;font-size:15px;display:grid;grid-template-columns:auto 1fr;gap:8px}
.dop p i{font-style:normal;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;height:fit-content;margin-top:2px}
.dop p.a{color:var(--warn)}.dop p.a i{background:#fde7e2}
.dop p.b{color:var(--ok)}.dop p.b i{background:#dff1e7}
.unlock{background:#fff6dc;border:2px solid var(--gold);border-radius:14px;padding:12px 16px;margin:16px 0;font-weight:700}
.scr .wrap,#log,#ctrl,#sheet header,.hud,.goalbar{zoom:var(--z,1)}
#fsCtl{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:14px}
#fsCtl button{min-width:44px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:900}
#fsCtl b{min-width:2.2em;text-align:center}
body.ingame #fsCtl{display:none}
.scr{padding-bottom:max(80px,env(safe-area-inset-bottom))}
.pts{margin:6px 0 12px;padding-left:22px}.pts li{margin:4px 0}
.how{margin:6px 0;color:var(--mute);font-size:15px}
#chain{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:min(420px,calc(100% - 24px));background:#fff;border:2px dashed var(--accent);border-radius:16px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:grid;gap:4px;font-weight:700;color:var(--accent);pointer-events:none;zoom:var(--z,1)}
#chain .say{color:var(--ink);font-weight:700;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
#fxl .fw.side{opacity:.6;font-weight:700}
#chain small{color:var(--mute);font-weight:500}
#chain div{animation:in .35s both}
.again{background:var(--soft);border:2px solid var(--accent);border-radius:14px;padding:12px 16px;margin:16px 0}.again b{display:block;color:var(--accent);font-size:18px}
.warn{background:#fff6dc;border:1px solid #efd38a;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:15px}
#ears{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (max-width:560px){
  .hud{gap:6px 8px;padding-left:10px;padding-right:10px}
  .hud .clock{display:none}
  .ibtn{min-width:40px;min-height:36px}
  .meter{flex-basis:100%;order:5}
  .tabs{grid-template-columns:1fr 1fr}
  #sheet{max-height:84vh}
  #sheet header h3{font-size:21px}
  .traits{grid-template-columns:1fr}
  .say2 th,.say2 td{padding:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-lv="pr">

<!-- ============ 開始畫面 ============ -->
<div class="scr" id="start">
  <div class="wrap">
    <div class="hero">
      <h1>同一間教室</h1>
      <p>換一顆腦袋，過同一個早上</p>
    </div>
    <div class="chars" id="chars"></div>
    <div class="row" style="justify-content:center">

const walk=(tx,ty)=>tx>=0&&ty>=0&&tx<MW&&ty<MH&&grid[ty][tx]===1;
function bfs(sx,sy,gx,gy){
  if(!walk(gx,gy))return null;const key=(x,y)=>y*MW+x,prev=new Map([[key(sx,sy),-1]]),q=[[sx,sy]];
  while(q.length){const [x,y]=q.shift();if(x===gx&&y===gy){const path=[];let k=key(x,y);while(k!==-1){path.push([k%MW,Math.floor(k/MW)]);k=prev.get(k)}return path.reverse()}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(walk(nx,ny)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),key(x,y));q.push([nx,ny])}}}
  return null}

function drawPerson(g,x,y,o){

  g.save();g.translate(x,y);
  g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(0,11,9,3.5,0,0,7);g.fill();
  g.fillStyle=o.pants||'#2c3a66';g.beginPath();g.ellipse(-3.2,8+lp*.3,2.6,3.6,0,0,7);g.fill();g.beginPath();g.ellipse(3.2,8-lp*.3,2.6,3.6,0,0,7);g.fill();
  g.fillStyle=o.shirt;g.strokeStyle='rgba(31,42,68,.35)';g.lineWidth=1;g.beginPath();g.ellipse(0,bob,7.5,7.5,0,0,7);g.fill();g.stroke();
  g.fillStyle='#f3cfaa';g.beginPath();g.arc(0,-11+bob,7.5,0,7);g.fill();
  g.fillStyle=o.hair||'#2a211c';g.beginPath();g.arc(0,-12.5+bob,7.6,Math.PI*1.02,Math.PI*1.98);g.fill();
  if(o.long){g.fillRect(-7.6,-12.5+bob,3,10);g.fillRect(4.6,-12.5+bob,3,10)}
  if(o.messy){g.beginPath();g.moveTo(-4,-19+bob);g.lineTo(-2,-23+bob);g.lineTo(0,-19+bob);g.lineTo(3,-23+bob);g.lineTo(4,-18+bob);g.fill()}
  g.fillStyle='#2a2a2a';g.beginPath();g.arc(-2.6+(o.fx||0)*2,-10.5+bob,1.1,0,7);g.arc(2.6+(o.fx||0)*2,-10.5+bob,1.1,0,7);g.fill();
  g.fillStyle='rgba(230,120,110,.45)';g.beginPath();g.arc(-4.5,-8+bob,1.4,0,7);g.arc(4.5,-8+bob,1.4,0,7);g.fill();
  g.restore();
  if(o.label){g.font='700 11px "Noto Sans TC",sans-serif';g.textAlign='center';g.textBaseline='middle';const tw=g.measureText(o.label).width+12;g.fillStyle=o.labelBg||'rgba(31,42,68,.85)';g.beginPath();g.roundRect?g.roundRect(x-tw/2,y-38+bob,tw,16,8):g.rect(x-tw/2,y-38+bob,tw,16);g.fill();g.fillStyle='#fff';g.fillText(o.label,x,y-30+bob);g.textBaseline='alphabetic'}
}
function cloud(g,x,y,text,color,alpha,tap,vb){
  g.save();g.globalAlpha=alpha;g.font='500 13px "Noto Sans TC",sans-serif';const w=Math.min(240,g.measureText(text).width+24+(tap?22:0)),h=28;
  let bx=x-w/2;if(vb)bx=clamp(bx,vb.l+4,vb.r-w-4);const by=y-64,cx0=bx+w/2;g.fillStyle='#fff';g.strokeStyle=color;g.lineWidth=2;g.setLineDash([5,4]);
  g.beginPath();g.roundRect?g.roundRect(bx,by,w,h,14):g.rect(bx,by,w,h);g.fill();g.stroke();g.setLineDash([]);
  g.beginPath();g.arc(x-6,by+h+6,4,0,7);g.fill();g.stroke();g.beginPath();g.arc(x-2,by+h+14,2.5,0,7);g.fill();g.stroke();
  g.fillStyle='#2b2a33';g.textAlign='center';g.textBaseline='middle';g.fillText(text,cx0-(tap?10:0),by+h/2,w-12-(tap?22:0));if(tap){g.font='15px sans-serif';g.fillText('👆',bx+w-16,by+h/2)}g.textBaseline='alphabetic';g.restore();return {x:bx,y:by,w,h}}

let S=null,P={x:29.5,y:10.5,moving:false,fx:0},path=null,keys={},running=false,paused=true,last=0,walkT=0,camX=0,camY=0,zoom=1,dpr=1,cvW=1,cvH=1;

function startMoment(i){

  if(mo.from){P.x=mo.from[0]+.5;P.y=mo.from[1]+.5;camX=camY=-1e4;S.thoughtT=.6}

  $('goal').innerHTML=esc(mo.goal).replace(/^(回到|回|去|走到)(.*)$/,'$1 <b>$2</b>');

function hud(){

function associate(){
  const L=LV(),th=S.thought&&S.thought.text,chain=L.chains&&L.chains[th];if(!chain||S.assocPause)return;
  S.assoc++;S.assocPause=true;S.assocT=99;path=null;keys={};P.moving=false;S.thought=null;S.thoughtRect=null;S.m=clamp(S.m-3,0,100);hud();AU.up();

  chain.forEach((c,i)=>setTimeout(()=>{const d=document.createElement('div');d.textContent='→ '+c;box.appendChild(d);AU.blip();
    const others=L.thoughts.filter(t=>t!==th);sideThought(pick(others))},step*(i+1)));

/* ---------- 移動 ---------- */
function targetTile(){return MO().spot}
function goTo(tx,ty){const p=bfs(Math.floor(P.x),Math.floor(P.y),tx,ty);if(p){path=p.slice(1);return true}return false}
function blocked(x,y,r){return !walk(Math.floor(x-r),Math.floor(y-r))||!walk(Math.floor(x+r),Math.floor(y-r))||!walk(Math.floor(x-r),Math.floor(y+r))||!walk(Math.floor(x+r),Math.floor(y+r))}
function update(dt){
  if(!S||S.inScene||S.assocPause)return;
  let dx=0,dy=0;if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
  const sp=4.2*dt;P.moving=false;
  if(dx||dy){path=null;const L=Math.hypot(dx,dy);dx=dx/L*sp;dy=dy/L*sp;if(!blocked(P.x+dx,P.y,.28))P.x+=dx;if(!blocked(P.x,P.y+dy,.28))P.y+=dy;P.moving=true;P.fx=Math.sign(dx)}
  else if(path&&path.length){const [tx,ty]=path[0],gx=tx+.5,gy=ty+.5,ddx=gx-P.x,ddy=gy-P.y,d=Math.hypot(ddx,ddy);
    if(d<=sp){P.x=gx;P.y=gy;path.shift()}else{P.x+=ddx/d*sp;P.y+=ddy/d*sp}P.moving=true;P.fx=Math.sign(ddx)}
  if(P.moving)walkT+=dt*6;
  S.thoughtT-=dt;if(S.thought){S.thought.t-=dt;if(S.thought.t<=0)S.thought=null}
  if(S.assocT>0)S.assocT-=dt;
  if(S.thoughtT<=0){const z=kind[Math.floor(P.y)]&&kind[Math.floor(P.y)][Math.floor(P.x)],pool=(z==='wood2'&&LV().thoughtsGifted)||LV().thoughts;const dur=LV().chains?5:3.2;S.thought={text:pick(pool),t:dur,dur};S.thoughtT=CFG.thoughtEvery+Math.random()*2}
  const [sx,sy]=targetTile();if(!S.arrived&&Math.hypot(P.x-(sx+.5),P.y-(sy+.5))<.75){S.arrived=true;path=null;playScene()}
}
function draw(){
  const cv=$('cv'),g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle='#c9c2b4';g.fillRect(0,0,cv.width,cv.height);

  let tx=P.x*TS-vw/2,ty=P.y*TS-vh/2;tx=vw>=WW?(WW-vw)/2:clamp(tx,0,WW-vw);ty=vh>=WH?(WH-vh)/2:clamp(ty,0,WH-vh);
  if(Math.abs(tx-camX)>400||Math.abs(ty-camY)>400){camX=tx;camY=ty}else{camX+=(tx-camX)*.15;camY+=(ty-camY)*.15}
  g.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);g.drawImage(STATIC,0,0);
  const now=performance.now()/1000,mo=MO();
  if(!S.arrived){const [sx,sy]=mo.spot,pulse=.5+.5*Math.sin(now*5),cx=sx*TS+16,cy=sy*TS+16;
    g.strokeStyle=`rgba(242,181,58,${.5+.5*pulse})`;g.lineWidth=4;g.beginPath();g.arc(cx,cy,12+pulse*4,0,7);g.stroke();
    g.fillStyle='#f2b53a';g.font='20px sans-serif';g.textAlign='center';g.fillText('⭐',cx,cy-20-Math.sin(now*4)*3)}
  const ents=[];
  SITTERS.forEach(([x,y],i)=>{if(S.lv==='pr'&&mo.id==='back'&&i===0)return;ents.push({y:y+.3,f:()=>{drawPerson(g,x*TS+16,y*TS+10,{shirt:'#f4f4f0',hair:HAIRS[i%4],long:i%3===1});g.fillStyle='#b98a55';g.fillRect(x*TS+3,y*TS+14,TS-6,TS-20)}})});
  (mo.cast||[]).forEach(([n,x,y],i)=>{const c=PEOPLE[n]||'#8a96a0',adult=/老師/.test(n);ents.push({y:y+.5,f:()=>drawPerson(g,x*TS+16,y*TS+16,{shirt:c,pants:adult?'#3b3a44':'#2c3a66',hair:HAIRS[(i+1)%4],long:/子涵|芊芊/.test(n),label:n,labelBg:c})})});

    const gr=g.createRadialGradient(px,py,r*.55,px,py,r);gr.addColorStop(0,'rgba(22,24,32,0)');gr.addColorStop(1,'rgba(22,24,32,.86)');g.fillStyle=gr;g.fillRect(0,0,cvW,cvH);
    if(!S.arrived){const [sx,sy]=mo.spot,tx2=((sx+.5)*TS-camX)*zoom,ty2=((sy+.5)*TS-camY)*zoom,pl=.5+.5*Math.sin(now*5);g.strokeStyle=`rgba(242,181,58,${.6+.4*pl})`;g.lineWidth=3;g.beginPath();g.arc(tx2,ty2,(12+pl*4)*zoom,0,7);g.stroke();g.fillStyle='#f2b53a';g.font='18px sans-serif';g.textAlign='center';g.fillText('⭐',tx2,ty2-18*zoom)}}
  S.thoughtRect=null;

    g.setTransform(dpr*zoom,0,0,dpr*zoom,-camX*dpr*zoom,-camY*dpr*zoom);
    const rc=cloud(g,P.x*TS,P.y*TS-6,S.thought.text,LV().color,Math.min(1,S.thought.t*2,(d-S.thought.t)*3),tap,{l:camX,r:camX+cvW/zoom});
    g.setTransform(dpr,0,0,dpr,0,0);if(tap)S.thoughtRect={x:(rc.x-camX)*zoom,y:(rc.y-camY)*zoom,w:rc.w*zoom,h:rc.h*zoom}}
  const mm=S.m/100;
  cv.style.filter=S.lv==='pr'?`grayscale(${clamp((S.m-25)/60,0,1).toFixed(2)})`:'';
  if(S.lv==='kq'&&mm>.3){const gr=g.createRadialGradient(cvW/2,cvH/2,Math.min(cvW,cvH)*.2,cvW/2,cvH/2,Math.max(cvW,cvH)*.72);gr.addColorStop(0,'rgba(40,30,50,0)');gr.addColorStop(1,`rgba(40,30,50,${((mm-.3)*.95).toFixed(2)})`);g.fillStyle=gr;g.fillRect(0,0,cvW,cvH)}
  cv.style.translate=(S.lv==='sh'&&mm>.55&&!RF()&&!S.inScene)?`${rnd(-1.5,1.5).toFixed(1)}px ${rnd(-1.5,1.5).toFixed(1)}px`:'';

      const ax=clamp(px+Math.cos(a)*Math.min(cvW,cvH)*.38,26,cvW-26),ay=clamp(py+Math.sin(a)*Math.min(cvW,cvH)*.38,26,cvH-26);

      if(p>=1){done=true;res(op);return}raf=requestAnimationFrame(step)};

    const stop=()=>{if(done||!raf)return;cancelAnimationFrame(raf);raf=null;p=0;fill.style.width='0';sp.forEach(s=>{s.style.transform='';s.style.opacity='.35'});sm.textContent='話又吞回去了……再試一次，按住不放';AU.down()};
    b.addEventListener('pointerdown',start);b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',stop);b.addEventListener('pointercancel',stop);b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(!e.repeat)start(e);else e.preventDefault()}});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop()})});
  c.querySelector('.op').focus({preventScroll:true})})}
async function playScene(){
  S.inScene=true;P.moving=false;const mo=MO();clearFx();
  $('shTime').textContent=mo.time;$('shTitle').textContent=mo.title;$('log').innerHTML='';$('ctrl').innerHTML='';
  $('shade').hidden=false;$('sheet').hidden=false;
  await beats(mo.beats);
  await bump(mo.gain);
  const op0=await askOptions(mo.ops),op=(S.kind&&op0.kind)?(S.kindUsed++,Object.assign({},op0,op0.kind)):op0;
  S.resp.push({id:mo.id,l:op0.l,peer:peerLine(op.r)});
  addBeat(['you',op.l]);S.picks.push({id:mo.id,l:op.l});if(op.f)S.flags[op.f]=true;
  if(op.mg){S.mgLog.push(op.mg);await MG[op.mg](op.mgp||{})}
  if(op.fxOff)setFx(op.fxOff,0);
  await beats(op.r);
  await bump(op.d);
  S.track.push({id:mo.id,peak:S.mPeak,over:S.mOver});
  const lastOne=S.mi===LV().moments.length-1;
  await waitTap(lastOne?'這一天結束了 ▶':'繼續這一天 ▶');
  $('sheet').hidden=true;$('shade').hidden=true;clearFx(op.keep);S.inScene=false;
  if(lastOne)finish();else startMoment(S.mi+1)}

/* ---------- 結算 ---------- */
// 從結果裡找同學說的第一句話（不是老師），找不到就用旁白
function peerLine(r){const s=(r||[]).find(b=>b[0]==='s'&&!/老師/.test(b[1]));if(s)return `${s[1]}：「${s[2]}」`;const n=(r||[]).find(b=>b[0]==='n');return n?n[1]:'—'}
function diffSection(L,lv){
  const f=SAVE.first[lv];if(!f)return '';
  const cards=L.moments.map(m=>{const p1=f.resp.find(p=>p.id===m.id),p2=S.picks.find(p=>p.id===m.id),ops=m.ops.filter(o=>o.kind&&((p1&&p1.l===o.l)||(p2&&p2.l===o.l)));if(!ops.length)return '';
    return `<div class="dcard"><b>${esc(m.title)}</b>${p1&&p2?`<p class="dpick">第一次你選「${esc(p1.l)}」<br>這一次你選「${esc(p2.l)}」</p>`:''}
      ${ops.map(o=>`<div class="dop"><span class="dif">如果你：${esc(o.l)}${p2&&p2.l===o.l?'<em>這次你選了這個</em>':''}${p1&&p1.l===o.l?'<em>第一次你選了這個</em>':''}</span>
        <p class="a"><i>第一次</i>${esc(peerLine(o.r))}</p><p class="b"><i>這一次</i>${esc(peerLine(o.kind.r))}</p></div>`).join('')}</div>`}).join('');
  return `<section><h2>兩次，同學的反應差在哪裡</h2><p style="margin:0 0 10px">${esc(L.name)}做了一樣的事，同學的回應卻不一樣。第一次爆發 ${f.over} 次，這一次爆發 ${S.over} 次。</p><div class="diff">${cards}</div></section>`}

// 單一數列長條圖：每個時刻心情最高到多少；爆發的時刻用紅色＋文字標示
function chartSVG(L,track){
  const W=480,H=230,pl=4,pr=4,pt=28,pb=40,n=track.length,bw=(W-pl-pr)/n,ch=H-pt-pb;
  const lines=[35,60,85].map(v=>{const y=pt+ch*(1-v/100);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(43,42,51,.10)" stroke-width="1"/>`}).join('');
  const bars=track.map((t,i)=>{const m=L.moments.find(x=>x.id===t.id),v=Math.max(4,t.peak),h=ch*v/100,x=pl+i*bw+bw*.22,w=bw*.56,y=pt+ch-h,hot=t.over>0,c=hot?'#c8432f':L.color,r=4;
    const word=wordOf(t.peak,L),tipT=`${m.short}：最高到「${word}」${hot?`，爆發 ${t.over} 次`:''}`;
    const p=`M${x},${pt+ch} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${pt+ch} Z`;
    return `<g class="bar" tabindex="0" data-tip="${esc(tipT)}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ch+pb}" fill="transparent"/><path d="${p}" fill="${c}"/>
      ${hot?`<text x="${x+w/2}" y="${y-8}" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2a33">💥 爆發</text>`:''}
      <text x="${pl+i*bw+bw/2}" y="${H-pb+24}" text-anchor="middle" font-size="16" fill="#2b2a33">${esc(m.short)}</text></g>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L.name)}每個時刻的${esc(L.meter.name)}最高值">${lines}<line x1="${pl}" x2="${W-pr}" y1="${pt+ch}" y2="${pt+ch}" stroke="rgba(43,42,51,.35)"/>${bars}</svg>`}
function finish(){
  running=false;const L=LV(),lv=S.lv,wasLocked=LOCKED('sh');
  SAVE.done[lv]=1;SAVE.plays[lv]=(SAVE.plays[lv]||0)+1;if(SAVE.plays[lv]===1)SAVE.first[lv]={resp:S.resp,over:S.over};store.set(SAVE);const firstTime=SAVE.plays[lv]===1,others=Object.keys(LEVELS).filter(k=>k!==lv&&!LOCKED(k)),justUnlocked=wasLocked&&!LOCKED('sh');
  const hot=S.track.filter(t=>t.over>0).map(t=>L.moments.find(m=>m.id===t.id).short);
  const headline=S.over?`爆發 ${S.over} 次（${hot.join('、')}）`:'今天沒有爆發';
  const ms=L.moments.map(m=>{const p=S.picks.find(x=>x.id===m.id),t=S.track.find(x=>x.id===m.id),w=wordOf(t.peak,L);
    return `<details class="mo"><summary><span class="t">${esc(m.title)}</span><span class="pk ${t.over?'hot':''}">${t.over?'💥 爆發':esc(w)}</span></summary>
      <div class="in"><p class="did">你選了：${esc(p.l)}</p><p>${esc(m.why)}</p><p class="do">${esc(m.peer)}</p></div></details>`}).join('');
  const tr=L.traits;
  $('endBody').innerHTML=`
    <p style="color:var(--mute);margin:8px 0 0">${esc(L.title)}</p>
    <h1 style="font-size:40px">${esc(L.name)}的早上結束了</h1>
    <section><div class="chartBox"><div class="head"><b>${esc(L.meter.name)}，每個時刻最高到哪裡</b><span>${esc(headline)}</span></div>${chartSVG(L,S.track)}</div></section>
    ${justUnlocked?`<div class="unlock">🔓 新角色出現了：書恆。回首頁就可以選他。</div>`:''}
    ${firstTime?`<div class="again"><b>🔁 再過一次${esc(L.name)}的早上</b>玩第二次，情節可能會不一樣：班上的同學會有不一樣的反應。</div>`:`<div class="again"><b>這是第 ${SAVE.plays[lv]} 次過${esc(L.name)}的早上</b>這一次，有些同學的反應不一樣了。同學的一句話，有改變${esc(L.name)}的心情嗎？</div>`}
    ${firstTime?'':diffSection(L,lv)}
    <section><h2>今天遇到的時刻</h2><p style="color:var(--mute);margin:0 0 6px;font-size:15px">點開看他為什麼會這樣，以及同學可以怎麼做。</p>${ms}</section>
    <section class="who2"><h2>他們是誰？</h2>
      <p>${esc(ABOUT.who)}</p>
      <div class="traits"><div><b>✨ ${esc(L.name)}的長處</b><ul>${tr.good.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><b>🧩 ${esc(L.name)}的困難</b><ul>${tr.hard.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
      <p>${esc(ABOUT.same)}</p>
      ${L.mask?`<div class="mask">${esc(L.mask)}</div>`:''}
    </section>
    <section><h2>可以怎麼看待他們</h2>
      <ul class="view">${ABOUT.view.map(([a,b])=>`<li><b>${esc(a)}</b>${esc(b)}</li>`).join('')}</ul>
      <table class="say2"><tr><th>不要這樣說</th><th>可以這樣說</th></tr>${ABOUT.say.map(([a,b])=>`<tr><td>「${esc(a)}」</td><td>「${esc(b)}」</td></tr>`).join('')}</table>
      <p class="note" style="margin-top:12px">${esc(ABOUT.last)}</p>
    </section>
    <div class="row" style="margin:24px 0">
      <button class="btn" data-act="${lv}">再過一次${esc(L.name)}的早上</button>
      ${others.map(k=>`<button class="btn alt" data-act="${k}">換成${esc(LEVELS[k].name)}</button>`).join('')}
      <button class="btn alt" data-go="start">回首頁</button>
    </div>`;
  $('endBody').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>openIntro(b.dataset.act));
  $('endBody').querySelectorAll('.bar').forEach(b=>{const show=e=>{const t=$('tip'),r=b.getBoundingClientRect();t.textContent=b.dataset.tip;t.hidden=false;t.style.left=Math.min(innerWidth-230,r.left+r.width/2-60)+'px';t.style.top=(r.top-36)+'px'};
    b.addEventListener('mouseenter',show);b.addEventListener('focus',show);b.addEventListener('click',show);b.addEventListener('mouseleave',()=>$('tip').hidden=true);b.addEventListener('blur',()=>$('tip').hidden=true)});
  $('end').onscroll=()=>$('tip').hidden=true;
  bindGo($('endBody'));showScreen('end');$('end').scrollTop=0}

/* ---------- 畫面切換 ---------- */
function showScreen(id){document.body.classList.toggle('ingame',id==='game');['start','warm','intro','game','end'].forEach(s=>$(s).hidden=s!==id);$('tip').hidden=true;if(id!=='game')clearFx();if(id!=='game'){running=false;$('sheet').hidden=true;$('shade').hidden=true}if(id==='start')renderStart()}
function bindGo(root){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showScreen(b.dataset.go))}
function renderStart(){
  $('wtabs').querySelector('[data-w="sh"]').hidden=LOCKED('sh');
  $('chars').innerHTML=Object.keys(LEVELS).map(k=>{const L=LEVELS[k],d=SAVE.done[k];
    if(LOCKED(k))return `<div class="char locked"><div class="face">🔒</div><h2>？？？</h2><p class="sub">還有一位同學。<br>品睿和可晴都玩過以後，就會出現。</p><span class="badge">${(SAVE.plays.pr?1:0)+(SAVE.plays.kq?1:0)} / 2</span></div>`;
    return `<div class="char"><div class="face" style="background:${L.color}">${L.face}</div>
    <h2>${esc(L.name)}</h2><p class="lvl" style="color:${L.color}">${esc(L.title)}</p><p class="sub">${esc(L.tagline)}</p>
    <span class="badge ${d?'on':''}">${d?`✓ 玩過 ${SAVE.plays[k]||1} 次`:'還沒玩'}</span>
    <button class="btn" style="background:${L.color}" data-lv="${k}">變成${esc(L.name)} ▶</button></div>`}).join('');
  $('chars').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>openIntro(b.dataset.lv))}
function openIntro(lv){
  if(LOCKED(lv)){showScreen('start');return}
  const L=LEVELS[lv];document.body.dataset.lv=lv;
  $('introBody').innerHTML=`<button class="btn alt small" data-go="start">← 回首頁</button>
    ${(SAVE.plays[lv]||0)>=1?`<div class="again"><b>🔁 第 ${(SAVE.plays[lv]||0)+1} 次過這一天</b>你還是${esc(L.name)}，還是同一天。這一次，班上有些同學會不太一樣。</div>`:`<div class="again"><b>💡 小提醒</b>每位角色都可以玩兩次。第二次玩，情節可能會不一樣喔！</div>`}
    <div class="card"><h2>${esc(L.title)}</h2><p>${esc(L.intro[0])}</p>
    <ul class="pts">${L.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    <div class="meterDemo"><b>${esc(L.meter.name)}</b><div class="bar" style="max-width:220px"><i style="width:30%;background:${L.color}"></i></div></div>
    <p class="how">${esc(L.meter.explain)}</p>
    <p class="how">💭 雲朵框是你心裡的話。點地圖或按「走過去」，走到 ⭐ 就會發生事情。</p>${L.hint?`<p class="how"><b>👆 ${esc(L.hint)}</b></p>`:''}</div>
    <div class="warn">⚠️ ${esc(L.warn)}<label class="rf"><input type="checkbox" id="rfBox" ${SAVE.rf?'checked':''}> 減少閃爍與晃動</label></div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="goPlay">開始這一天 ▶</button></div>`;
  bindGo($('introBody'));$('goPlay').onclick=()=>newRun(lv);$('rfBox').onchange=e=>{SAVE.rf=e.target.checked?1:0;store.set(SAVE)};
  showScreen('intro');$('intro').scrollTop=0}
function renderWarm(k){const w=WARM[k];$('wcloud').style.setProperty('--c',w.c);$('wcloud').innerHTML=w.t.map(t=>`<p>${esc(t)}</p>`).join('');$('wnote').textContent=w.n;
  $('wtabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===k?'true':'false'))}

/* ---------- 輸入 ---------- */
function bindInput(){
  addEventListener('keydown',e=>{
    if(!$('sheet').hidden){if((e.key==='Enter'||e.key===' ')&&tapResolve&&document.activeElement&&document.activeElement.id!=='next'){e.preventDefault();tapResolve()}return}
    if($('game').hidden)return;const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','a','s','d'].includes(k)){keys[k]=true;e.preventDefault()}});
  addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
  addEventListener('blur',()=>keys={});
  $('cv').addEventListener('pointerdown',e=>{if(!S||S.inScene||S.assocPause)return;AU.init();const r=$('cv').getBoundingClientRect();
    if(S.thoughtRect){const q=S.thoughtRect,cx=e.clientX-r.left,cy=e.clientY-r.top;if(cx>=q.x-8&&cx<=q.x+q.w+8&&cy>=q.y-8&&cy<=q.y+q.h+8){associate();return}}
    const wx=((e.clientX-r.left)/zoom+camX)/TS,wy=((e.clientY-r.top)/zoom+camY)/TS;
    let tx=Math.floor(wx),ty=Math.floor(wy);if(!walk(tx,ty)){let best=null,bd=9;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(walk(tx+i,ty+j)){const dd=Math.hypot(i,j);if(dd<bd){bd=dd;best=[tx+i,ty+j]}}if(!best)return;[tx,ty]=best}goTo(tx,ty)});
  $('walkBtn').onclick=()=>{if(S&&S.assocPause)return;AU.init();const [x,y]=targetTile();goTo(x,y)};
  $('sndBtn').onclick=()=>{AU.init();AU.set(!AU.on);$('sndBtn').textContent=AU.on?'🔊':'🔇';$('sndBtn').setAttribute('aria-pressed',AU.on?'true':'false')};
  $('homeBtn').onclick=()=>showScreen('start');
  $('toWarm').onclick=()=>{renderWarm('most');showScreen('warm')};
  $('wtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>renderWarm(b.dataset.w));
  bindGo(document);addEventListener('resize',resize)}

const FS=[[.9,'小'],[1,'中'],[1.15,'大'],[1.3,'特大']];
function setFs(i){i=clamp(i,0,FS.length-1);SAVE.fs=i;store.set(SAVE);document.documentElement.style.setProperty('--z',FS[i][0]);$('fsLbl').textContent=FS[i][1];$('fsBtn').title='字體：'+FS[i][1]}
document.querySelectorAll('#fsCtl [data-fs]').forEach(b=>b.onclick=()=>setFs((SAVE.fs??1)+(+b.dataset.fs)));
$('fsBtn').onclick=()=>{setFs(((SAVE.fs??1)+1)%FS.length);banner('字體：'+FS[SAVE.fs][1])};
setFs(SAVE.fs??1);
STATIC=buildStatic();bindInput();$('sndBtn').textContent=AU.on?'🔊':'🔇';showScreen('start');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{STATIC=buildStatic()});
/* 測試用：自動跑時把玩家直接放到目標 */
window.__SC={associate:()=>associate(),unlock(){SAVE.plays.pr=SAVE.plays.pr||1;SAVE.plays.kq=SAVE.plays.kq||1;store.set(SAVE);renderStart()},fast:false,MG,state:()=>S,warp(){if(!S)return;const [x,y]=targetTile();P.x=x+.5;P.y=y+.5},bfs,walk,LEVELS,MW,MH};
</script>
